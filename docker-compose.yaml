---
# Simplified docker-compose for running the full stack locally
# Use: make docker-up

services:
  postgres:
    container_name: nosmallparts_postgres
    hostname: postgres
    image: postgres:17
    environment:
      POSTGRES_DB: 'no-small-parts'
      POSTGRES_PASSWORD: 'hunter2'
      POSTGRES_USER: 'dbuser'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dbuser -d no-small-parts']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nosmallparts

  redis:
    container_name: nosmallparts_redis
    hostname: redis
    image: redis:7-bullseye
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nosmallparts

  backend:
    container_name: nosmallparts_backend
    hostname: backend
    build:
      context: ./backend
      dockerfile: deploy/dockerfiles/api_server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIGURATION_FILEPATH: '/etc/config'
      NO_SMALL_PARTS_LIVEKIT_API_KEY: '${LIVEKIT_API_KEY}'
      NO_SMALL_PARTS_LIVEKIT_API_SECRET: '${LIVEKIT_API_SECRET}'
      NO_SMALL_PARTS_LIVEKIT_URL: '${LIVEKIT_URL}'
    ports:
      - '8000:8000'
      - '8001:8001'
    volumes:
      - source: './backend/deploy/environments/localdev/config_files/api_service_config.json'
        target: '/etc/config'
        type: 'bind'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8000/_ops_/ready || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nosmallparts

  frontend:
    container_name: nosmallparts_frontend
    hostname: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      GRPC_BACKEND_URL: 'backend:8001'
      BACKEND_HTTP_URL: 'http://backend:8000'
      NEXT_PUBLIC_BACKEND_WS_URL: 'ws://localhost:8000/ws/stages'
    ports:
      - '3000:3000'
    networks:
      - nosmallparts

networks:
  nosmallparts:
    driver: bridge
