---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-small-parts-async-message-handler-deployment
  labels:
    app: no-small-parts-backend
    app.kubernetes.io/name: no-small-parts-backend-services
spec:
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: no-small-parts-backend
      app.kubernetes.io/name: no-small-parts-backend-services
  replicas: 1
  template:
    metadata:
      labels:
        app: no-small-parts-backend
        app.kubernetes.io/name: no-small-parts-backend-services
    spec:
      containers:
        - name: no-small-parts-async-message-handler
          image: no-small-parts-async-message-handler
          imagePullPolicy: Always
          env:
            - name: "CONFIGURATION_FILEPATH"
              value: "/etc/service-config.json"
            - name: "RUNNING_IN_KUBERNETES"
              value: "true"
            - name: "NO_SMALL_PARTS_OBSERVABILITY_METRICS_OTEL_SERVICE_NAME"
              value: "no_small_parts_async_function_handler"
            - name: "NO_SMALL_PARTS_OBSERVABILITY_TRACING_TRACING_SERVICE_NAME"
              value: "no_small_parts_async_function_handler"
          volumeMounts:
            - name: "config"
              mountPath: "/etc/service-config.json"
              subPath: "config.json"
      volumes:
        - name: "config"
          configMap:
            name: "no-small-parts-async-message-handler-config"
---
