---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-small-parts-admin-webapp-deployment
  labels:
    app: no-small-parts-admin-webapp
    app.kubernetes.io/name: no-small-parts-admin-webapp
spec:
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: no-small-parts-admin-webapp
      app.kubernetes.io/name: no-small-parts-admin-webapp
  replicas: 1
  template:
    metadata:
      labels:
        app: no-small-parts-admin-webapp
        app.kubernetes.io/name: no-small-parts-admin-webapp
    spec:
      containers:
        - name: no-small-parts-admin-webapp
          image: no-small-parts-admin-webapp
          imagePullPolicy: Always
          env:
            - name: "CONFIGURATION_FILEPATH"
              value: "/etc/service-config.json"
            - name: "RUNNING_IN_KUBERNETES"
              value: "true"
            - name: "NO_SMALL_PARTS_OBSERVABILITY_METRICS_OTEL_SERVICE_NAME"
              value: "no_small_parts_admin_webapp"
            - name: "NO_SMALL_PARTS_OBSERVABILITY_TRACING_TRACING_SERVICE_NAME"
              value: "no_small_parts_admin_webapp"
          volumeMounts:
            - name: "config"
              mountPath: "/etc/service-config.json"
              subPath: "config.json"
          ports:
            - containerPort: 8888
              name: http
          livenessProbe:
            httpGet:
              path: "/login"
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/login"
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: "config"
          configMap:
            name: "no-small-parts-admin-webapp-config"
---
