---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: no-small-parts-job-search-data-index-scheduler
spec:
  concurrencyPolicy: Replace
  schedule: "*/30 * * * *" # every 30 minutes
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: search-data-index-scheduler
              image: no-small-parts-job-search-data-index-scheduler
              imagePullPolicy: Always
              env:
                - name: "CONFIGURATION_FILEPATH"
                  value: "/etc/service-config.json"
                - name: "SEARCH_INDEXING_TOPIC_NAME"
                  value: "search_index_requests"
                - name: "NO_SMALL_PARTS_OBSERVABILITY_METRICS_OTEL_SERVICE_NAME"
                  value: "no_small_parts_job_search_data_index_scheduler"
                - name: "NO_SMALL_PARTS_OBSERVABILITY_TRACING_TRACING_SERVICE_NAME"
                  value: "no_small_parts_job_search_data_index_scheduler"
              volumeMounts:
                - name: "config"
                  mountPath: "/etc/service-config.json"
                  subPath: "config.json"
          restartPolicy: OnFailure
          volumes:
            - name: "config"
              configMap:
                name: "no-small-parts-job-search-data-index-scheduler-config"
---
