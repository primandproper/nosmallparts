# Database connection environment variables for Deployments
# Applied via JSON patch to inject database secrets from kubernetes secret (api-service-secrets)
# Config expects READ_CONNECTION_ and WRITE_CONNECTION_ (see database/config/config.go)
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: NO_SMALL_PARTS_DATABASE_READ_CONNECTION_HOST
    valueFrom:
      secretKeyRef:
        name: api-service-secrets
        key: DATABASE_HOST
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: NO_SMALL_PARTS_DATABASE_READ_CONNECTION_PASSWORD
    valueFrom:
      secretKeyRef:
        name: api-service-secrets
        key: DATABASE_PASSWORD
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: NO_SMALL_PARTS_DATABASE_WRITE_CONNECTION_HOST
    valueFrom:
      secretKeyRef:
        name: api-service-secrets
        key: DATABASE_HOST
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: NO_SMALL_PARTS_DATABASE_WRITE_CONNECTION_PASSWORD
    valueFrom:
      secretKeyRef:
        name: api-service-secrets
        key: DATABASE_PASSWORD
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: NO_SMALL_PARTS_DATABASE_OAUTH2_TOKEN_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: api-service-secrets
        key: OAUTH2_TOKEN_ENCRYPTION_KEY
