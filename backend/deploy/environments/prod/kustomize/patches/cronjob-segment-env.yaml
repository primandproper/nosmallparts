# Segment analytics environment variable for CronJobs
# Applied via JSON patch to inject Segment API token
- op: add
  path: "/spec/jobTemplate/spec/template/spec/containers/0/env/-"
  value:
    name: NO_SMALL_PARTS_ANALYTICS_SEGMENT_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: api-service-secrets
        key: SEGMENT_API_TOKEN
