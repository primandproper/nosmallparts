---
# See: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# See: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/resource/
resources:
  - ../../../kustomize/components/api_server
  - ../../../kustomize/components/workers
  - ../../../kustomize/components/async_functions
  - ../../../kustomize/components/admin_webapp
  # Uncomment to enable MCP server deployment
  # - ../../../kustomize/components/mcp_server

images:
  - name: no-small-parts-service-api
    newName: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-service-api
    newTag: latest

  - name: no-small-parts-job-db-cleaner
    newName: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-job-db-cleaner
    newTag: latest

  - name: no-small-parts-job-search-data-index-scheduler
    newName: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-job-search-data-index-scheduler
    newTag: latest

  - name: no-small-parts-async-message-handler
    newName: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-async-message-handler
    newTag: latest

  - name: no-small-parts-admin-webapp
    newName: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-admin-webapp
    newTag: latest

  # Uncomment to enable MCP server deployment
  # - name: no-small-parts-mcp-server
  #   newName: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-mcp-server
  #   newTag: latest

# See: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/
patches:
  ### API Server - needs database, pubsub, service secrets, and CSI volume for secrets
  - path: patches/deployment-secrets-csi-volume.yaml
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-service-api-deployment
  - path: patches/deployment-database-env.yaml
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-service-api-deployment
  - path: patches/deployment-pubsub-env.yaml
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-service-api-deployment
  - path: patches/deployment-service-secrets-env.yaml
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-service-api-deployment

  ### Async Message Handler - needs database, pubsub, service secrets, environment, and CSI volume
  - path: patches/deployment-secrets-csi-volume.yaml
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-async-message-handler-deployment
  - path: patches/deployment-database-env.yaml
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-async-message-handler-deployment
  - path: patches/deployment-pubsub-env.yaml
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-async-message-handler-deployment
  - path: patches/deployment-service-secrets-env.yaml
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-async-message-handler-deployment
  - patch: |-
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: NO_SMALL_PARTS_SERVICE_ENVIRONMENT
          value: prod
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-async-message-handler-deployment

  ### DB Cleaner CronJob - needs database only and Workload Identity
  - path: patches/cronjob-secrets-csi-volume.yaml
    target:
      kind: CronJob
      name: no-small-parts-job-db-cleaner
  - path: patches/cronjob-database-env.yaml
    target:
      kind: CronJob
      name: no-small-parts-job-db-cleaner

  ### Search Data Index Scheduler CronJob - needs database, pubsub, and Workload Identity
  - path: patches/cronjob-secrets-csi-volume.yaml
    target:
      kind: CronJob
      name: no-small-parts-job-search-data-index-scheduler
  - path: patches/cronjob-database-env.yaml
    target:
      kind: CronJob
      name: no-small-parts-job-search-data-index-scheduler
  - path: patches/cronjob-pubsub-env.yaml
    target:
      kind: CronJob
      name: no-small-parts-job-search-data-index-scheduler

  ### Admin Webapp - needs cookie and API service config
  - patch: |-
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: NO_SMALL_PARTS_COOKIES_COOKIE_NAME
          valueFrom:
            secretKeyRef:
              name: admin-webapp-config
              key: COOKIE_NAME
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: NO_SMALL_PARTS_COOKIES_HASH_KEY
          valueFrom:
            secretKeyRef:
              name: admin-webapp-config
              key: COOKIE_HASH_KEY
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: NO_SMALL_PARTS_COOKIES_BLOCK_KEY
          valueFrom:
            secretKeyRef:
              name: admin-webapp-config
              key: COOKIE_BLOCK_KEY
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: NO_SMALL_PARTS_COOKIES_DOMAIN
          valueFrom:
            secretKeyRef:
              name: admin-webapp-config
              key: COOKIE_DOMAIN
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: NO_SMALL_PARTS_API_SERVICE_HTTP_API_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: admin-webapp-config
              key: API_SERVER_HTTP_URL
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: NO_SMALL_PARTS_API_SERVICE_GRPC_API_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: admin-webapp-config
              key: API_SERVER_GRPC_URL
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: NO_SMALL_PARTS_API_SERVICE_OAUTH2_API_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: admin-webapp-config
              key: OAUTH2_CLIENT_ID
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: NO_SMALL_PARTS_API_SERVICE_OAUTH2_API_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: admin-webapp-config
              key: OAUTH2_CLIENT_SECRET
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-admin-webapp-deployment

labels:
  - pairs:
      app.kubernetes.io/name: no-small-parts-backend
      deployed_by: skaffold

configMapGenerator:
  - name: no-small-parts-service-api-config
    namespace: prod
    files:
      - config.json=./configs/api_service_config.json

  - name: no-small-parts-async-message-handler-config
    namespace: prod
    files:
      - config.json=./configs/async_message_handler_config.json

  - name: no-small-parts-job-db-cleaner-config
    namespace: prod
    files:
      - config.json=./configs/job_db_cleaner_config.json

  - name: no-small-parts-job-search-data-index-scheduler-config
    namespace: prod
    files:
      - config.json=./configs/job_search_data_index_scheduler_config.json

  - name: no-small-parts-admin-webapp-config
    namespace: prod
    files:
      - config.json=./configs/admin_webapp_config.json

  # Uncomment to enable MCP server deployment
  # - name: no-small-parts-mcp-server-config
  #   namespace: prod
  #   files:
  #     - config.json=./configs/mcp_server_config.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    generated_by: skaffold
    deployed_by: skaffold
  annotations:
    generated_by: skaffold
    deployed_by: skaffold
