---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: no-small-parts-backend

profiles:
  - name: localdev
    activation:
      - kubeContext: docker-desktop
    build:
      local:
        push: false
      tagPolicy:
        sha256: {}
      artifacts:
        # backend artifacts (ko)
        - image: no-small-parts-service-api
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/services/api/http
            fromImage: golang:1.25-trixie

        - image: no-small-parts-job-db-cleaner
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/workers/db_cleaner
            fromImage: golang:1.25-trixie

        - image: no-small-parts-job-search-data-index-scheduler
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/workers/search_data_index_scheduler
            fromImage: golang:1.25-trixie

        - image: no-small-parts-admin-webapp
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/services/admin
            fromImage: golang:1.25-trixie

        - image: no-small-parts-mcp-server
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/services/mcp
            fromImage: golang:1.25-trixie

          # NOTE: no cmd/functions here

    manifests:
      kustomize:
        paths:
          - deploy/environments/localdev/kustomize

    deploy:
      kubeContext: docker-desktop
      kubectl:
        defaultNamespace: localdev
    portForward:
      - resourceType: Service
        resourceName: no-small-parts-api-svc
        namespace: localdev
        port: 8000
      - resourceType: Service
        resourceName: no-small-parts-admin-webapp-svc
        namespace: localdev
        port: 8888

  - name: dev
    build:
      tagPolicy:
        sha256: {}
      artifacts:
        # backend artifacts (ko)
        - image: us-central1-docker.pkg.dev/no-small-parts-dev/containers/no-small-parts-service-api
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/services/api/http
            fromImage: golang:1.25-trixie

        - image: us-central1-docker.pkg.dev/no-small-parts-dev/containers/no-small-parts-job-db-cleaner
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/workers/db_cleaner
            fromImage: golang:1.25-trixie

        - image: us-central1-docker.pkg.dev/no-small-parts-dev/containers/no-small-parts-job-search-data-index-scheduler
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/workers/search_data_index_scheduler
            fromImage: golang:1.25-trixie

        - image: us-central1-docker.pkg.dev/no-small-parts-dev/containers/no-small-parts-async-message-handler
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/functions/async_message_handler
            fromImage: golang:1.25-trixie

        - image: us-central1-docker.pkg.dev/no-small-parts-dev/containers/no-small-parts-admin-webapp
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/services/admin
            fromImage: golang:1.25-trixie

    manifests:
      kustomize:
        paths:
          - deploy/environments/dev/kustomize

    deploy:
      kubectl:
        defaultNamespace: dev

  - name: prod
    build:
      tagPolicy:
        sha256: {}
      artifacts:
        - image: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-service-api
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/services/api/http
            fromImage: golang:1.25-trixie

        - image: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-job-db-cleaner
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/workers/db_cleaner
            fromImage: golang:1.25-trixie

        - image: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-job-search-data-index-scheduler
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/workers/search_data_index_scheduler
            fromImage: golang:1.25-trixie

        - image: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-async-message-handler
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/functions/async_message_handler
            fromImage: golang:1.25-trixie

        - image: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-admin-webapp
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
            main: ./cmd/services/admin
            fromImage: golang:1.25-trixie

    manifests:
      kustomize:
        paths:
          - deploy/environments/prod/kustomize

    deploy:
      kubectl:
        defaultNamespace: prod
