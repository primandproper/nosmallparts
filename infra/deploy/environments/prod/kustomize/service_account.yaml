---
# Kubernetes ServiceAccount annotated for Workload Identity
# This allows pods to authenticate as the GCP service account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service-account
  namespace: prod
  annotations:
    iam.gke.io/gcp-service-account: workload-identity-sa@no-small-parts.iam.gserviceaccount.com
---
