---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: no-small-parts-ingress
  annotations:
    kubernetes.io/ingress.class: gce
    external-dns.alpha.kubernetes.io/hostname: "nosmall.parts,www.nosmall.parts"
spec:
  tls:
    - hosts:
        - api.nosmall.parts
        - nosmall.parts
        - www.nosmall.parts
        - admin.nosmall.parts
      secretName: no-small-parts-cert
  rules:
    - host: "api.nosmall.parts"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: no-small-parts-api-svc
                port:
                  number: 8000
    - host: "nosmall.parts"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: no-small-parts-frontend-svc
                port:
                  number: 3000
    - host: "www.nosmall.parts"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: no-small-parts-frontend-svc
                port:
                  number: 3000
    - host: "admin.nosmall.parts"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: no-small-parts-admin-webapp-svc
                port:
                  number: 8888
---
