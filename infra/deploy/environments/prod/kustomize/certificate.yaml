---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: no-small-parts-cert
spec:
  secretName: no-small-parts-cert

  secretTemplate:
    annotations:
      managed_by: "cert-manager"
    labels:
      managed_by: "cert-manager"

  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048

  duration: 2160h
  renewBefore: 360h

  isCA: false
  usages:
    - server auth
    - client auth

  subject:
    organizations:
      - no-small-parts

  dnsNames:
    - api.nosmall.parts
    - app.nosmall.parts
    - admin.nosmall.parts
    - www.nosmall.parts

  issuerRef:
    name: letsencrypt
    kind: Issuer
    group: cert-manager.io
---
