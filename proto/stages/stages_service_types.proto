syntax = "proto3";

package stages;

import "play_scripts/play_scripts_messages.proto";
import "stages/stages_messages.proto";

option go_package = "github.com/verygoodsoftwarenotvirus/nosmallparts/backend/internal/grpc/generated/services/stages";

// StageState represents the current state of a stage for client consumption.
message StageState {
  string id = 1;
  string code = 2;
  StagePhase phase = 3;
  repeated StageParticipant participants = 4;
  optional play_scripts.PlayScript selected_play = 5;
  int32 current_line_index = 6;
}

message JoinStageRequest {
  string stage_id = 1; // Stage ID or 6-char code
  string participant_name = 2;
}

message JoinStageResponse {
  string participant_id = 1;
  StageState stage_state = 2;
  repeated play_scripts.PlayScript plays = 3;
}

message GetStageStateRequest {
  string stage_id = 1; // Stage ID or 6-char code
}

message GetStageStateResponse {
  StageState stage_state = 1;
}

message UpdateParticipantRequest {
  string stage_id = 1;
  string participant_id = 2;
  optional bool is_director = 3;
  optional bool is_ready = 4;
  optional bool is_audience = 5;
}

message UpdateParticipantResponse {
  StageState stage_state = 1;
}

message ToggleRoleRequest {
  string stage_id = 1;
  string participant_id = 2;
  string cast_member_id = 3;
}

message ToggleRoleResponse {
  repeated StageParticipant participants = 1;
  StageState stage_state = 2;
}

message UpdateStageRequest {
  string stage_id = 1;
  optional string play_script_id = 2;
  optional StagePhase phase = 3;
  optional int32 current_line_index = 4;
}

message UpdateStageResponse {
  StageState stage_state = 1;
}

message SendChatRequest {
  string stage_id = 1;
  string participant_id = 2;
  string text = 3;
  bool cast_only = 4;
}

message SendChatResponse {
  ChatMessage message = 1;
}

message LeaveStageRequest {
  string stage_id = 1;
  string participant_id = 2;
}

message LeaveStageResponse {}

message StartPlayRequest {
  string stage_id = 1;
}

message StartPlayResponse {
  StageState stage_state = 1;
}

message NextLineRequest {
  string stage_id = 1;
}

message NextLineResponse {
  StageState stage_state = 1;
  bool line_advanced = 2;
  int32 current_line_index = 3;
  bool play_ended = 4;
  optional play_scripts.PlayScript next_play = 5;
}

message ResetPlayRequest {
  string stage_id = 1;
}

message ResetPlayResponse {
  StageState stage_state = 1;
}
