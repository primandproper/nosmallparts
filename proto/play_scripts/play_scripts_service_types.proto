syntax = "proto3";

package play_scripts;

import "common.proto";
import "filtering.proto";
import "play_scripts/play_scripts_messages.proto";

option go_package = "github.com/verygoodsoftwarenotvirus/nosmallparts/backend/internal/grpc/generated/services/play_scripts";

message PlayScriptCastMemberCreationInput {
  string id = 1; // Client-provided ID for referencing in lines
  string name = 2;
  string description = 3;
  int32 sort_order = 4;
}

message PlayScriptLineCreationInput {
  string cast_member_id = 1; // References PlayScriptCastMemberCreationInput.id
  string line_text = 2;
  int32 line_index = 3;
  string direction = 4;
  ScrollMode scroll_mode = 5;
  int32 auto_scroll_wpm = 6;
}

message PlayScriptCreationRequestInput {
  string title = 1;
  string description = 2;
  string author = 3;
  bool is_public = 4;
  repeated PlayScriptCastMemberCreationInput cast_members = 5;
  repeated PlayScriptLineCreationInput lines = 6;
}

message PlayScriptUpdateRequestInput {
  optional string title = 1;
  optional string description = 2;
  optional string author = 3;
  optional bool is_public = 4;
  optional string preceded_by_id = 5;
  optional string precedes_id = 6;
}

message CreatePlayScriptRequest {
  PlayScriptCreationRequestInput input = 1;
}

message CreatePlayScriptResponse {
  common.ResponseDetails response_details = 1;
  PlayScript created = 2;
}

message GetPlayScriptRequest {
  string play_script_id = 1;
  bool include_linked_scripts = 2;
}

message GetPlayScriptResponse {
  common.ResponseDetails response_details = 1;
  PlayScript result = 2;
}

message GetPlayScriptsRequest {
  filtering.QueryFilter filter = 1;
}

message GetPlayScriptsResponse {
  common.ResponseDetails response_details = 1;
  filtering.Pagination pagination = 2;
  repeated PlayScript results = 3;
}

message GetPlayScriptsForAccountRequest {
  string account_id = 1;
  filtering.QueryFilter filter = 2;
}

message GetPlayScriptsForAccountResponse {
  common.ResponseDetails response_details = 1;
  filtering.Pagination pagination = 2;
  repeated PlayScript results = 3;
}

message GetPublicPlayScriptsRequest {
  filtering.QueryFilter filter = 1;
}

message GetPublicPlayScriptsResponse {
  common.ResponseDetails response_details = 1;
  filtering.Pagination pagination = 2;
  repeated PlayScript results = 3;
}

message UpdatePlayScriptRequest {
  string play_script_id = 1;
  PlayScriptUpdateRequestInput input = 2;
}

message UpdatePlayScriptResponse {
  common.ResponseDetails response_details = 1;
  PlayScript updated = 2;
}

message ArchivePlayScriptRequest {
  string play_script_id = 1;
}

message ArchivePlayScriptResponse {
  common.ResponseDetails response_details = 1;
}

message GetPlayScriptsWithTagRequest {
  string tag_name = 1;
  filtering.QueryFilter filter = 2;
}

message GetPlayScriptsWithTagResponse {
  common.ResponseDetails response_details = 1;
  filtering.Pagination pagination = 2;
  repeated PlayScript results = 3;
}

message CreateScriptTagRequest {
  string name = 1;
  string description = 2;
}

message CreateScriptTagResponse {
  common.ResponseDetails response_details = 1;
  ScriptTag created = 2;
}

message AddTagToPlayScriptRequest {
  string play_script_id = 1;
  string script_tag_id = 2;
}

message AddTagToPlayScriptResponse {
  common.ResponseDetails response_details = 1;
}

message RemoveTagFromPlayScriptRequest {
  string play_script_id = 1;
  string script_tag_id = 2;
}

message RemoveTagFromPlayScriptResponse {
  common.ResponseDetails response_details = 1;
}
