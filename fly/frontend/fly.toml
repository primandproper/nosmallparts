app = "nsp-frontend"
primary_region = "iad"

[build]
  dockerfile = "frontend/Dockerfile"

[env]
  NODE_ENV = "production"
  GRPC_BACKEND_URL = "nsp-api.internal:8001"
  BACKEND_HTTP_URL = "http://nsp-api.internal:8000"
  COOKIE_DOMAIN = "nosmall.parts"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[checks]
  [checks.health]
    port = 3000
    type = "http"
    interval = "15s"
    timeout = "5s"
    path = "/"
