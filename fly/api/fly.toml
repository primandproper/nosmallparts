app = "nsp-api"
primary_region = "iad"

[build]
  dockerfile = "fly/api/Dockerfile"

[env]
  CONFIGURATION_FILEPATH = "/config/config.json"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[checks]
  [checks.health]
    port = 8000
    type = "http"
    interval = "15s"
    timeout = "5s"
    path = "/_ops_/ready"

[[mounts]]
  source = "uploads_data"
  destination = "/uploads"
