app = "nosmallparts"
primary_region = "ord"

[build]

# The image carries its config. Secrets are set with `fly secrets set`, never
# here: NOSMALLPARTS_TOKENS_SIGNING_KEY, NOSMALLPARTS_COOKIES_HASH_KEY and
# NOSMALLPARTS_COOKIES_BLOCK_KEY (base64), NOSMALLPARTS_LIVEKIT_API_KEY,
# NOSMALLPARTS_LIVEKIT_API_SECRET and NOSMALLPARTS_LIVEKIT_URL for video, and
# NOSMALLPARTS_ADMIN_EMAILS (comma-separated) for admins.

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[[mounts]]
  source = "nosmallparts_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
