---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../kustomize/components/frontend

patches:
  - path: patches/deployment-backend-env.yaml
    target:
      version: v1
      kind: Deployment
      name: no-small-parts-frontend-deployment

images:
  - name: no-small-parts-frontend
    newName: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-frontend
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/name: no-small-parts-frontend
      deployed_by: skaffold

namespace: prod
---
