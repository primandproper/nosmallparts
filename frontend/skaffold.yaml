---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: no-small-parts-frontend

profiles:
  - name: localdev
    activation:
      - kubeContext: docker-desktop
    build:
      local:
        push: false
      tagPolicy:
        sha256: {}
      artifacts:
        - image: no-small-parts-frontend
          docker:
            dockerfile: Dockerfile
          context: .
    manifests:
      kustomize:
        paths:
          - deploy/environments/localdev/kustomize
    deploy:
      kubeContext: docker-desktop
      kubectl:
        defaultNamespace: localdev

  - name: prod
    build:
      tagPolicy:
        sha256: {}
      artifacts:
        - image: us-central1-docker.pkg.dev/no-small-parts/containers/no-small-parts-frontend
          docker:
            dockerfile: Dockerfile
          context: .
    manifests:
      kustomize:
        paths:
          - deploy/environments/prod/kustomize
    deploy:
      kubectl:
        defaultNamespace: prod
