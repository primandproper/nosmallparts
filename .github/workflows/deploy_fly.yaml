---
name: deploy fly

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - fly/**

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      pull-requests: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - backend/**
              - fly/api/**
            frontend:
              - frontend/**
              - fly/frontend/**

  deploy-api:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        run: flyctl deploy --config fly/api/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    needs: [changes, deploy-api]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy frontend
        run: >
          flyctl deploy
          --config fly/frontend/fly.toml
          --dockerfile frontend/Dockerfile
          --build-arg NEXT_PUBLIC_WS_URL=wss://nosmall.parts/ws/stage
          --build-arg NEXT_PUBLIC_ADSENSE_PUBLISHER_ID=${{ secrets.NO_SMALL_PARTS_ADSENSE_PUBLISHER_ID }}
          --build-arg NEXT_PUBLIC_ADSENSE_SLOT_ID=${{ secrets.NO_SMALL_PARTS_ADSENSE_SLOT_ID }}
          frontend/
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
