---
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: lint terraform
jobs:
  changes:
    permissions:
      pull-requests: read
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      infra_prod: ${{ steps.filter.outputs.infra_prod }}
      backend_prod: ${{ steps.filter.outputs.backend_prod }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra_prod:
              - infra/deploy/environments/prod/terraform/**
            backend_prod:
              - backend/deploy/environments/prod/terraform/**

  infra:
    needs: [changes]
    if: ${{ needs.changes.outputs.infra_prod == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"
          cli_config_credentials_token: ${{ secrets.TERRAFORM_CLOUD_API_TOKEN }}

      - name: Terraform Init
        working-directory: infra/deploy/environments/prod/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/deploy/environments/prod/terraform
        run: terraform validate -no-color

  backend:
    needs: [changes]
    if: ${{ needs.changes.outputs.backend_prod == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"
          cli_config_credentials_token: ${{ secrets.TERRAFORM_CLOUD_API_TOKEN }}

      - name: Terraform Init
        working-directory: backend/deploy/environments/prod/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: backend/deploy/environments/prod/terraform
        run: terraform validate -no-color
