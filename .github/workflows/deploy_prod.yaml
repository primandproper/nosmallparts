---
# Deploy API and/or frontend to prod (Cloud Run). Runs only for changed paths.
on:
  - pull_request
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - backend/**
  #     - frontend/**
  #     - terraform/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

name: deploy prod
jobs:
#  changes:
#    permissions:
#      pull-requests: read
#      contents: read
#    outputs:
#      backend: ${{ steps.filter.outputs.backend }}
#      frontend: ${{ steps.filter.outputs.frontend }}
#    runs-on: ubuntu-latest
#    steps:
#      - uses: actions/checkout@v5
#
#      - uses: dorny/paths-filter@v3
#        id: filter
#        with:
#          filters: |
#            backend:
#              - backend/**
#              - backend/terraform/**
#            frontend:
#              - frontend/**
#              - frontend/terraform/**
#            terraform_backend:
#              - backend/terraform/**
#            terraform_frontend:
#              - frontend/terraform/**

  terraform-backend:
#    needs: [changes]
#    if: ${{ needs.changes.outputs.terraform_backend == 'true' || needs.changes.outputs.terraform_frontend == 'true' }}
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
    outputs:
      cloud_run_api_url: ${{ steps.outputs.outputs.cloud_run_api_url }}
      artifact_registry_repository_id: ${{ steps.outputs.outputs.artifact_registry_repository_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4
          cli_config_credentials_token: ${{ secrets.TERRAFORM_CLOUD_API_TOKEN }}

      - name: Copy API config for Terraform (optional)
        run: |
          if [ -f backend/deploy/environments/dev/kustomize/configs/api_service_config.json ]; then
            cp backend/deploy/environments/dev/kustomize/configs/api_service_config.json backend/terraform/environments/prod/service-config.json
          fi

      - name: Terraform Init
        working-directory: backend/terraform/environments/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: backend/terraform/environments/prod
        env:
          TF_LOG: INFO
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT }}
          TF_VAR_google_cloud_credentials: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
          # TFC workspace env vars are not available when running from GHA; pass secrets as TF_VAR_*
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_media_bucket_name: ${{ secrets.GCP_PROJECT }}-media
          TF_VAR_userdata_bucket_name: ${{ secrets.GCP_PROJECT }}-userdata
        run: terraform apply -auto-approve -input=false

      - name: Terraform outputs
        id: outputs
        working-directory: backend/terraform/environments/prod
        run: |
          echo "cloud_run_api_url<<EOF" >> $GITHUB_OUTPUT
          terraform output -raw cloud_run_api_url >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "artifact_registry_repository_id<<EOF" >> $GITHUB_OUTPUT
          terraform output -raw artifact_registry_repository_id >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  deploy-api:
    needs: [terraform-backend]
#    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    env:
      GCP_REGION: us-central1
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      ARTIFACT_REPO: containers
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push to Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories create ${{ env.ARTIFACT_REPO }} \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --description="Images for No Small Parts Cloud Run" \
            || true

      - name: Build and push API image
        run: |
          docker build \
            -f backend/deploy/dockerfiles/api_server.Dockerfile \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/nosmallparts-api:${{ github.sha }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/nosmallparts-api:latest \
            ./backend
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/nosmallparts-api:${{ github.sha }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/nosmallparts-api:latest

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: nosmallparts-api-prod
          project_id: ${{ env.GCP_PROJECT }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/nosmallparts-api:latest

