---
concurrency:
  group: ${{ github.ref }}

on:
  - pull_request
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - infra/**
  #     - backend/**
  #     - frontend/**
  #     - skaffold.yaml
  #     - proto/**

name: deploy prod
jobs:
  changes:
    permissions:
      pull-requests: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - infra/**
            backend:
              - backend/**
            frontend:
              - frontend/**

  baseline-infra:
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.NO_SMALL_PARTS_GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: prod
          context_name: prod_context
          location: us-central1

      - name: Copy kubeconfig for backend Terraform
        run: |
          mkdir -p backend/deploy/environments/prod/terraform
          cp ${{ env.KUBECONFIG }} backend/deploy/environments/prod/terraform/terraform_kubeconfig

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"
          cli_config_credentials_token: ${{ secrets.TERRAFORM_CLOUD_API_TOKEN }}

      - name: Terraform Init
        working-directory: infra/deploy/environments/prod/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/deploy/environments/prod/terraform
        run: terraform validate -no-color

      - name: Terraform Apply
        working-directory: infra/deploy/environments/prod/terraform
        run: terraform apply -auto-approve

  backend-infra:
    needs: [changes, baseline-infra]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      (needs.baseline-infra.result == 'success' || needs.baseline-infra.result == 'skipped')
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.NO_SMALL_PARTS_GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push to pkg.dev
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: prod
          context_name: prod_context
          location: us-central1

      - name: Copy kubeconfig for backend Terraform
        run: |
          mkdir -p backend/deploy/environments/prod/terraform
          cp ${{ env.KUBECONFIG }} backend/deploy/environments/prod/terraform/terraform_kubeconfig

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"
          cli_config_credentials_token: ${{ secrets.TERRAFORM_CLOUD_API_TOKEN }}

      - name: Terraform Init
        working-directory: backend/deploy/environments/prod/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: backend/deploy/environments/prod/terraform
        run: terraform validate -no-color

      - name: Terraform Apply
        working-directory: backend/deploy/environments/prod/terraform
        run: terraform apply -auto-approve

      - name: Remove kubeconfig
        if: always()
        run: rm -f backend/deploy/environments/prod/terraform/terraform_kubeconfig

  applications:
    needs: [changes, baseline-infra, backend-infra]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.changes.outputs.infra == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      (needs.baseline-infra.result == 'success' || needs.baseline-infra.result == 'skipped') &&
      (needs.backend-infra.result == 'success' || needs.backend-infra.result == 'skipped')
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.NO_SMALL_PARTS_GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push to pkg.dev
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: prod
          context_name: prod_context
          location: us-central1

      - name: Install Skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin

      - name: Deploy cert-manager
        run: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml

      - name: Skaffold deploy
        run: skaffold run --filename=skaffold.yaml --build-concurrency 1 --profile prod
